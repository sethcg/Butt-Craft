// SHARED BUILD LOGIC FOR EVERY MINECRAFT VERSION PROJECT.
// APPLIED FROM <version>/build.gradle, WHICH ONLY PICKS THE LOOM VERSION.
//
// SOURCES COME FROM TWO PLACES:
//   common/      EVERYTHING THAT COMPILES UNCHANGED ON EVERY SUPPORTED VERSION
//   <version>/src  ONLY WHAT IS SPECIFIC TO THAT MINECRAFT VERSION

version = "${project.mod_version}+${project.minecraft_version}"

base {
	archivesName = "buttcraft"
}

apply from: rootProject.file("gradle/common.gradle")

loom {
	splitEnvironmentSourceSets()

	mods {
		"buttcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			srcDir rootProject.file("common/main/java")
		}

		resources {
			srcDir rootProject.file("common/main/resources")
		}
	}

	client {
		java {
			srcDir rootProject.file("common/client/java")
		}

		resources {
			srcDir rootProject.file("common/client/resources")
		}
	}
}
