// SHARED BUILD LOGIC FOR EVERY MINECRAFT VERSION PROJECT.
// APPLIED FROM <version>/build.gradle, WHICH ONLY PICKS THE LOOM VERSION.
//
// SOURCES COME FROM TWO PLACES:
//   common/      EVERYTHING THAT COMPILES UNCHANGED ON EVERY SUPPORTED VERSION
//   <version>/src  ONLY WHAT IS SPECIFIC TO THAT MINECRAFT VERSION

apply plugin: 'maven-publish'

version = "${project.mod_version}+${project.minecraft_version}"

loom {
	splitEnvironmentSourceSets()

	mods {
		"buttcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			srcDir rootProject.file("common/main/java")
		}

		resources {
			srcDir rootProject.file("common/main/resources")
		}
	}

	client {
		java {
			srcDir rootProject.file("common/client/java")
		}

		resources {
			srcDir rootProject.file("common/client/resources")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version
	def javaVersion = project.java_version

	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", loaderVersion
	inputs.property "java_version", javaVersion

	filesMatching("fabric.mod.json") {
		expand(
			"version": version,
			"minecraft_version": minecraftVersion,
			"loader_version": loaderVersion,
			"java_version": javaVersion
		)
	}
}

def javaVersion = project.java_version as Integer

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	archiveBaseName = "buttcraft"

	from("LICENSE") {
		rename { "${it}_buttcraft" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
